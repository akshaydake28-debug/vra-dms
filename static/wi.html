<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work Instruction — V R ALUCAST</title>
<style>
:root{--navy:#0d2f6e;--bg:#f0f3f9;--line:#dde3ef;--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#1a1a2e;font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;background:#fff;min-height:100vh}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.co{font-size:11px;letter-spacing:.12em;opacity:.75;font-weight:700}
.no{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;opacity:.9;margin-top:6px}
h1{font-size:19px;line-height:1.3;margin:2px 0 8px}
.pill{display:inline-block;font-size:12px;font-weight:700;background:#dcfce7;color:#14532d;border-radius:999px;padding:2px 10px}
.banner{margin:12px 16px 0;padding:10px 12px;border-radius:8px;background:#fef3c7;color:#78350f;font-size:13.5px;font-weight:600;border:1px solid #fcd34d}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.info span:nth-child(odd){color:var(--muted)}
.sec{padding:9px 16px;background:#e3eaf7;color:var(--navy);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.step{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.step img{width:100%;border-radius:8px;background:#f3f4f6;display:block}
.t{display:flex;gap:12px;align-items:flex-start}
.t b{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--navy);font-size:18px;min-width:26px}
.t div{font-weight:500;white-space:pre-line}
.ln{font-size:14px;border-radius:7px;padding:6px 10px;white-space:pre-line}
.msg{padding:60px 24px;text-align:center;color:var(--muted)}
footer{padding:18px 16px 28px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Loading…</div></div>
<script>
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const EX={key:['Key point','#eee9fb','#5b3fb3'],check:['Check','#e5f4ea','#15803d'],avoid:['Avoid','#fbe7e5','#b42318'],tool:['Tool','#e3eaf7','#0d2f6e']};
  const num=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
  const paperRev=new URLSearchParams(location.search).get('rev');
  const app=document.getElementById('app');
  fetch('/api/public/wi/'+encodeURIComponent(num)).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{
    if(!ok){app.innerHTML='<div class="msg"><b>'+esc(num)+'</b><br><br>'+esc(j.error||'Not found')+'</div>';return}
    document.title=j.docNumber+' — '+j.title;
    const wi=j.wi||{}, steps=wi.steps||[], inst=wi.instruments||[];
    const instName=id=>{const g=inst.find(x=>String(x.id)===String(id));return g?((g.gaugeId?g.gaugeId+' · ':'')+g.name):''};
    let n=0;
    const info=[['Machine',wi.machineLabel],['Area',wi.area],['Part',wi.partLabel],['Instruments',inst.map(g=>(g.gaugeId?g.gaugeId+' ':'')+g.name).join(', ')],['PPE',(wi.ppe||[]).join(', ')]].filter(x=>x[1]);
    app.innerHTML=
      '<header><div class="co">V R ALUCAST</div><div class="no">'+esc(j.docNumber)+' · Rev '+esc(j.revision)+'</div>'+
      '<h1>'+esc(j.title)+'</h1><span class="pill">✓ Current approved revision</span></header>'+
      (paperRev&&paperRev!==j.revision?'<div class="banner">⚠ Your printed copy is Rev '+esc(paperRev)+'. The current revision is Rev '+esc(j.revision)+'. Follow this screen and ask your supervisor to replace the paper copy.</div>':'')+
      (info.length?'<div class="info">'+info.map(([l,v])=>'<span>'+l+'</span><span>'+esc(v)+'</span>').join('')+'</div>':'')+
      steps.map(s=>{
        if(s.kind==='section') return '<div class="sec">'+esc(s.text)+'</div>';
        n++;
        const img=wi.photos&&s.photo?'<a href="/api/public/wi-photo/'+encodeURIComponent(s.photo)+'" target="_blank" rel="noopener"><img loading="lazy" src="/api/public/wi-photo/'+encodeURIComponent(s.photo)+'" alt="Step '+n+'"></a>':'';
        const lines=['key','check','avoid','tool'].filter(k=>s[k]).map(k=>'<div class="ln" style="background:'+EX[k][1]+';color:'+EX[k][2]+'"><b>'+EX[k][0]+':</b> '+esc(k==='tool'?instName(s.tool):s[k])+'</div>').join('');
        return '<div class="step">'+img+'<div class="t"><b>'+n+'</b><div>'+esc(s.text)+'</div></div>'+lines+'</div>';
      }).join('')+
      '<footer>Approved'+(j.approvedBy?' by '+esc(j.approvedBy):'')+(j.approvalDate?' on '+esc(String(j.approvalDate).slice(0,10)):'')+'<br>Read only. Opened from the QR code on the printed copy.</footer>';
  }).catch(()=>{app.innerHTML='<div class="msg">Could not load. Check the network and try again.</div>'});
})();
</script>
</body>
</html>
