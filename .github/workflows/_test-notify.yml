name: Test Failure Notification (temporary)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'fail or succeed'
        required: true
        default: 'fail'

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Maybe fail
        run: |
          if [ "${{ github.event.inputs.mode }}" = "fail" ]; then
            echo "Simulating failure"; exit 1
          fi
          echo "Simulating success"

      - name: Open/update issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 TEST notification issue";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'backup-failure'
            });
            const mine = existing.data.find(i => i.title === title);
            if (mine) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: mine.number,
                body: `Failed again: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: `Test failure notification. Run: ${runUrl}`, labels: ['backup-failure']
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 TEST notification issue";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'backup-failure'
            });
            const mine = existing.data.find(i => i.title === title);
            if (mine) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: mine.number,
                body: `Succeeded: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: mine.number, state: 'closed'
              });
            }
